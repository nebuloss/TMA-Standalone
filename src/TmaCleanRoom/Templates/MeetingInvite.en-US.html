<div data-tma-clean-room="meeting" lang="en-US" style="mso-ansi-language:EN-US;margin:0;font-family:'Segoe UI',Arial,sans-serif;color:#242424;font-size:14px;line-height:1.5">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="width:600px;max-width:100%;border-collapse:separate;background:#ffffff;border:1px solid #e2e2ea">
    <tr>
      <td style="height:6px;background:#5b5fc7;font-size:1px;line-height:1px">&nbsp;</td>
    </tr>
    <tr>
      <td style="padding:28px 32px 12px 32px">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0">
          <tr>
            <td width="44" height="44" style="width:44px;height:44px;text-align:center;vertical-align:middle">
              <img src="{{TEAMS_ICON}}" width="36" height="36" alt="Microsoft Teams" style="display:block;width:36px;height:36px;border:0">
            </td>
            <td style="padding-left:14px">
              <div style="font-size:12px;line-height:16px;color:#616161;text-transform:uppercase;letter-spacing:.6px">Microsoft Teams</div>
              <div style="font-size:22px;line-height:28px;color:#242424;font-weight:600">Meeting invitation</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 8px 32px;color:#424242;font-size:15px">
        You can join this meeting using the Teams app or your web browser.
      </td>
    </tr>
    <tr>
      <td style="padding:18px 32px 22px 32px">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0">
          <tr>
            <td style="background:#5b5fc7;padding:12px 22px;text-align:center">
              <a href="{{JOIN_URL}}" style="display:inline-block;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600">Join the Teams meeting</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 24px 32px">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="width:100%;background:#f7f7fc;border-left:4px solid #d9d9f7">
          <tr>
            <td style="padding:14px 16px">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="font-size:13px;line-height:20px">
                <tr>
                  <td style="padding:5px 0;color:#616161;width:120px">Meeting ID</td>
                  <td style="padding:5px 0;color:#242424;font-weight:600"><span class="MsoNoProof" style="mso-no-proof:yes;text-decoration:none;color:#242424">{{MEETING_ID}}</span></td>
                </tr>
                {{PASSCODE_ROW}}
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 24px 32px;border-top:1px solid #ededf2;font-size:13px;color:#616161">
        {{OPTIONS_BLOCK}}
        <a href="https://aka.ms/JoinTeamsMeeting" style="color:#5b5fc7;text-decoration:underline">Help joining a meeting</a>
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid #ededf2;font-size:11px;line-height:16px;color:#8a8a8a">
          If the button does not work, you can
          <a href="{{JOIN_URL}}" style="color:#7070b8;text-decoration:underline;word-break:break-all">open the meeting with this link</a>.
        </div>
      </td>
    </tr>
  </table>
</div>
