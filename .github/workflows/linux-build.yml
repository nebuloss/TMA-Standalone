name: Linux MSI build

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install lightweight build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools unzip
          dotnet tool install --global wix --version 7.0.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Build Windows MSI on Linux
        shell: pwsh
        run: ./scripts/build/Build-Linux.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TMA-Standalone-msi
          path: TMA-Standalone.msi
