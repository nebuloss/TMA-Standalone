name: Build and release MSI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install lightweight build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools wixl unzip
      - name: Build Windows MSI on Linux
        id: build
        shell: bash
        run: |
          set -o pipefail
          pwsh -NoProfile -File ./scripts/build/Build-Linux.ps1 2>&1 | tee build-linux.log
      - name: Expose build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 build-linux.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 build-linux.log | tac | while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/'%0D'}
            line=${line//$'\n'/'%0A'}
            echo "::error::$line"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: TMA-Standalone-msi
          path: TMA-Standalone.msi
          if-no-files-found: error
