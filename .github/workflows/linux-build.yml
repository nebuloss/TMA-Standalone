name: Build and release MSI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.424'
      - name: Install lightweight build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools wixl unzip p7zip-full cabextract
      - name: Build Windows MSI on Linux
        id: build
        shell: bash
        run: |
          set -o pipefail
          pwsh -NoProfile -File ./scripts/build/Build-Linux.ps1 2>&1 | tee build-linux.log
      - name: Expose build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 build-linux.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 build-linux.log | tac | while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/'%0D'}
            line=${line//$'\n'/'%0A'}
            echo "::error::$line"
          done
      - name: Generate release checksum
        shell: bash
        run: sha256sum TMA-Standalone.msi > TMA-Standalone.msi.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TMA-Standalone-msi
          path: |
            TMA-Standalone.msi
            TMA-Standalone.msi.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TMA-Standalone-msi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            TMA-Standalone.msi
            TMA-Standalone.msi.sha256
