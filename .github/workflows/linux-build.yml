name: Build and release MSI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.424'
      - name: Install lightweight build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools wixl unzip p7zip-full cabextract
      - name: Build Windows MSI on Linux
        id: build
        shell: bash
        run: |
          set -o pipefail
          pwsh -NoProfile -File ./scripts/build/Build-Linux.ps1 2>&1 | tee build-linux.log
      - name: Expose build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 build-linux.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 build-linux.log | tac | while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/'%0D'}
            line=${line//$'\n'/'%0A'}
            echo "::error::$line"
          done
      - name: Generate release checksum
        shell: bash
        run: sha256sum TMA-Standalone.msi > TMA-Standalone.msi.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: TMA-Standalone-msi
          path: |
            TMA-Standalone.msi
            TMA-Standalone.msi.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: TMA-Standalone-msi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME"
          TMA-Standalone.msi TMA-Standalone.msi.sha256
          --verify-tag --generate-notes
